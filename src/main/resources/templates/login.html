<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>


    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet"
          th:href="@{/css/user.css}">


</head>

<body>

<div class="auth-container">


    <div class="auth-card">

        <h1>Welcome Back</h1>

        <p class="auth-subtitle">
            Login to manage your properties
        </p>


        <!-- Login Error -->
        <div th:if="${param.error}"
             class="login-error">

            Invalid email or password.

        </div>


        <!-- Logout Message -->
        <div th:if="${param.logout}"
             class="logout-message">

            You have been logged out successfully.

        </div>


        <!-- Login Form -->
        <form method="post"
              th:action="@{/login}">


            <!-- Email -->
            <div class="form-group">

                <label for="username">
                    Email Address
                </label>

                <input type="email"
                       id="username"
                       name="username"
                       placeholder="Enter your email"
                       required>

            </div>


            <!-- Password -->
            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Enter your password"
                       required>

            </div>


            <!-- Login Button -->
            <button type="submit"
                    class="auth-button">

                Login

            </button>

        </form>


        <!-- Register Link -->
        <p class="auth-footer">

            Don't have an account?

            <a th:href="@{/register}">
                Create Account
            </a>

        </p>

    </div>


</div>

</body>

</html>
