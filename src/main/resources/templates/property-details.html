<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Property Details</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<h1>Property Details</h1>

<div class="property-details">

    <h2 th:text="${property.title}">
        Property Title
    </h2>
    <img class="property-image"
            th:if="${property.imagePath != null}"
         th:src="@{'/uploads/' + ${property.imagePath}}"
         alt="Property Image">
    <p>
        <strong>Property Type:</strong>
        <span th:text="${property.propertyType}"></span>
    </p>

    <p>
        <strong>Listing Type:</strong>
        <span th:text="${property.listingType}"></span>
    </p>

    <p>
        <strong>Price:</strong>
        <span th:text="${property.price}"></span>
    </p>

    <p>
        <strong>Location:</strong>
        <span th:text="${property.location}"></span>
    </p>

    <p>
        <strong>Bedrooms:</strong>
        <span th:text="${property.bedrooms}"></span>
    </p>

    <p>
        <strong>Bathrooms:</strong>
        <span th:text="${property.bathrooms}"></span>
    </p>

    <p>
        <strong>Area:</strong>
        <span th:text="${property.area}"> sq ft</span>
    </p>

    <p>
        <strong>Description:</strong>
        <span th:text="${property.description}"></span>
    </p>

    <p>
        <strong>Status:</strong>
        <span th:text="${property.status}"></span>
    </p>

    <p>
        <strong>Insert Date:</strong>
        <span th:text="${property.insertDate}"></span>
    </p>

    <p>
        <strong>Expected Date:</strong>
        <span th:text="${property.expectedDate}"></span>
    </p>

    <p>
        <strong>Sold/Rented Date:</strong>
        <span th:text="${property.soldOrRentedDate}"></span>
    </p>


    <!-- Edit Button -->
    <a th:href="@{/property/edit/{id}(id=${property.id})}">
        Edit
    </a>


    <!-- Delete Button -->
    <a th:href="@{/property/delete/{id}(id=${property.id})}"
       onclick="return confirm('Are you sure you want to delete this property?')">
        Delete
    </a>


    <br><br>

    <!-- Back to List -->
    <a th:href="@{/property/list}">
        Back to Property List
    </a>

</div>

</body>
</html>
