<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>


    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account</title>

    <link rel="stylesheet"
          th:href="@{/css/user.css}">

</head>

<body>

<div class="auth-container">


    <div class="auth-card">

        <h1>Create Account</h1>

        <p class="auth-subtitle">
            Register to manage your properties
        </p>


        <!-- Register Form -->
        <form method="post"
              th:action="@{/register}"
              th:object="${user}">


            <!-- Name -->
            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input type="text"
                       id="name"
                       th:field="*{name}"
                       placeholder="Enter your full name"
                       required>

            </div>


            <!-- Email -->
            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input type="email"
                       id="email"
                       th:field="*{email}"
                       placeholder="Enter your email"
                       required>

            </div>


            <!-- Password -->
            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input type="password"
                       id="password"
                       th:field="*{password}"
                       placeholder="Enter your password"
                       required>

            </div>


            <!-- Register Button -->
            <button type="submit"
                    class="auth-button">

                Create Account

            </button>

        </form>


        <!-- Login Link -->
        <p class="auth-footer">

            Already have an account?

            <a th:href="@{/login}">
                Login
            </a>

        </p>

    </div>


</div>

</body>

</html>
